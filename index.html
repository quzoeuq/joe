<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Joe&Joe</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3ead8;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #0b4f7a;
      font-size: 56px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 32px;
      justify-content: center;
      margin-top: 40px;
    }
    .card {
      background: rgba(255,255,255,0.6);
      border-radius: 16px;
      padding: 20px;
    }
    img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .name {
      margin-top: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #0b4f7a;
    }
  </style>
</head>
<body>
  <h1>Joe与Joe</h1>
  <p>一个关于寿星 Joe 的血染钟楼生日剧本</p>

  <div class="grid">
    <div class="card">
      <img src="majiang.png" />
      <div class="name">麻将Joe</div>
    </div>

    <div class="card">
      <img src="icons/juben.png" />
      <div class="name">剧本杀Joe</div>
    </div>

    <div class="card">
      <img src="icons/bad.png" />
      <div class="name">羽毛球Joe</div>
    </div>

    <div class="card">
      <img src="icons/board.png" />
      <div class="name">桌游Joe</div>
    </div>

    <div class="card">
      <img src="icons/golf.png" />
      <div class="name">高尔夫Joe</div>
    </div>

    <div class="card">
      <img src="icons/bask.png" />
      <div class="name">篮球Joe</div>
    </div>
  </div>
</body>
</html>
